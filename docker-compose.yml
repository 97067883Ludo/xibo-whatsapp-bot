services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Data Source=/data/schermpostvak.db"
      Storage__Root: "/data/media"
      Webhook__Token: "${WEBHOOK_TOKEN}"
      Waha__BaseUrl: "http://waha:3000"
      Waha__ApiKey: "${WAHA_API_KEY}"
      Waha__Session: "${WAHA_SESSION:-default}"
      Xibo__BaseUrl: "${XIBO_BASE_URL}"
      Xibo__ClientId: "${XIBO_CLIENT_ID}"
      Xibo__ClientSecret: "${XIBO_CLIENT_SECRET}"
      Xibo__Tag: "${XIBO_TAG:-onscreen}"
    volumes:
      - ./data/backend:/data
    depends_on:
      - waha

  waha:
    # WhatsApp gateway. Pin a version tag from https://hub.docker.com/r/devlikeapro/waha/tags once it works.
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "3000:3000" # dashboard at http://localhost:3000/dashboard (scan the QR code here)
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME:-admin}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_SWAGGER_USERNAME: "${WAHA_DASHBOARD_USERNAME:-admin}"
      WHATSAPP_SWAGGER_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      # GOWS is lightweight (no browser inside the container)
      WHATSAPP_DEFAULT_ENGINE: "GOWS"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      # Webhook for every session: incoming messages and what the bot's own phone sends
      WHATSAPP_HOOK_URL: "http://backend:8080/webhook/waha?token=${WEBHOOK_TOKEN}"
      WHATSAPP_HOOK_EVENTS: "message.any"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "true"
      # Host used in media.url; the backend fetches files from here
      WAHA_BASE_URL: "http://waha:3000"
      # Keep received files for an hour, so webhook retries can still fetch them
      WHATSAPP_FILES_LIFETIME: "3600"
    volumes:
      - ./data/waha/sessions:/app/.sessions
